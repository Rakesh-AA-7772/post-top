<!-- name.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Enter name — Minimal Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8f9fa;
      --border: #e6e8ee;
      --accent: #ff0b58;
      --text: #111111;
      --text-secondary: #666666;
      --muted: #a0a5b0;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --card: #1a1f26;
        --border: #2a2f36;
        --text: #e8eaed;
        --text-secondary: #b0b5c0;
        --muted: #6b7280;
      }
    }

    body {
      background: var(--bg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .card {
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      background: var(--card);
      animation: slideUp 0.4s ease-out;
      transition: all 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    label {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      margin-top: 10px;
      font-size: 16px;
      font-family: 'Inter', inherit;
      background: transparent;
      color: var(--text);
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 11, 88, 0.08);
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 0;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
      font-family: 'Inter', inherit;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }

    button:active {
      transform: translateY(0);
    }

    small {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Welcome</h1>
    <label for="name">Enter your name (displayed with posts)</label>
    <input id="name" type="text" maxlength="40" placeholder="e.g. Alex Chen" autofocus />
    <button id="continue">Continue</button>
    <small>✨ Names are session-only (stored in your browser). No account required.</small>
  </div>

  <script type="module">
    const input = document.getElementById('name');
    const btn = document.getElementById('continue');

    function sanitizeName(n){
      return n.trim().replace(/\s+/g,' ').slice(0,40);
    }

    btn.addEventListener('click', () => {
      const raw = input.value || '';
      const name = sanitizeName(raw);
      if (name.length < 1) {
        alert('Please enter a name (1–40 characters).');
        input.focus();
        return;
      }
      localStorage.setItem('username', name);
      window.location.href = 'index.html';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
