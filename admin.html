<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1419"><title>Admin — WE WRITE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1419;--card:#1a1f26;--line:#2a3039;--pink:#ff0b58;--muted:#9ba4b2;--text:#eef1f5;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,rgba(255,11,88,.1),transparent 40%),var(--bg);color:var(--text);min-height:100vh}header{padding:16px max(18px,calc((100% - 1000px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:rgba(15,20,25,.88);backdrop-filter:blur(14px)}.brand{font:700 18px Poppins;color:#42ed35;letter-spacing:.16em;text-decoration:none}.brand span{color:var(--pink)}header a:last-child{color:var(--muted);text-decoration:none;font-size:13px}main{max-width:1000px;margin:36px auto;padding:0 18px}h1{font:700 28px Poppins;margin:0}p{color:var(--muted);font-size:13px}.notice{padding:18px;border:1px solid rgba(255,11,88,.45);border-radius:14px;background:rgba(255,11,88,.06);line-height:1.6}.report{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0;display:grid;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted);font-size:12px}.tag{color:var(--pink);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}button{background:#242b35;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:600;cursor:pointer}button:hover{border-color:var(--pink);color:var(--pink)}button.danger{background:rgba(255,11,88,.12);border-color:rgba(255,11,88,.4)}#status{margin:16px 0;color:var(--muted);font-size:13px}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
</style></head><body><header><a class="brand" href="index.html">WE <span>WRITE</span> / ADMIN</a><a href="index.html">← Back to site</a></header>
<main><h1>Moderation desk</h1><p>Private tools for authorized moderators. Access is controlled by a Firebase custom admin claim.</p><div id="status">Sign in with your administrator account.</div><form id="adminLogin" class="notice"><label>Email <input id="adminEmail" type="email" required autocomplete="username"></label><br><br><label>Password <input id="adminPassword" type="password" required autocomplete="current-password"></label><br><br><button type="submit">Sign in as admin</button></form><section id="reports"></section></main>
<script type="module">
import {db,auth} from './firebase.js';
import {getIdTokenResult,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js';
import {collection,query,where,orderBy,limit,onSnapshot,doc,updateDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js';
const status=document.getElementById('status'),root=document.getElementById('reports');
const loginForm=document.getElementById('adminLogin');
async function startAdminSession(user){
  const token=await getIdTokenResult(user,true);
  if(token.claims.admin!==true){status.textContent='This account is signed in, but it does not have the admin claim.';root.innerHTML='';return;}
  loginForm.style.display='none';
  status.textContent='Administrator verified. Open reports appear below.';
  const q=query(collection(db,'reports'),where('status','==','open'),orderBy('createdAt','desc'),limit(100));
  onSnapshot(q,snap=>{root.innerHTML='';if(snap.empty){root.innerHTML='<div class="empty">No open reports. Nice work ✨</div>';return;}
    snap.forEach(d=>{const r=d.data(),el=document.createElement('article');el.className='report';const title=document.createElement('div');title.innerHTML='<span class="tag">OPEN REPORT · '+String(r.reason||'other').toUpperCase()+'</span>';const meta=document.createElement('div');meta.className='muted';meta.textContent='Post ID: '+r.postId+' · Reporter UID: '+r.reporterUid;const actions=document.createElement('div');actions.className='row';const open=document.createElement('button');open.textContent='Open post';open.onclick=()=>location.href='post-detail.html?id='+encodeURIComponent(r.postId);const reviewed=document.createElement('button');reviewed.textContent='Mark reviewed';reviewed.onclick=()=>updateDoc(doc(db,'reports',d.id),{status:'reviewed'});const remove=document.createElement('button');remove.className='danger';remove.textContent='Remove post';remove.onclick=async()=>{if(confirm('Permanently remove this reported post?')){await deleteDoc(doc(db,'posts',r.postId));await updateDoc(doc(db,'reports',d.id),{status:'reviewed'});}};actions.append(open,reviewed,remove);el.append(title,meta,actions);root.append(el);});});
}
if(auth.currentUser && !auth.currentUser.isAnonymous) startAdminSession(auth.currentUser);
loginForm.addEventListener('submit',async(event)=>{event.preventDefault();const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;try{if(auth.currentUser?.isAnonymous)await signOut(auth);const credential=await signInWithEmailAndPassword(auth,email,password);await startAdminSession(credential.user);}catch(error){status.textContent='Sign-in failed: '+error.message;}});

</script></body></html>
