<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Share Your Thoughts</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff0b58">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8f9fa;
      --border: #e6e8ee;
      --accent: #ff0b58;
      --text: #111111;
      --text-secondary: #666666;
      --muted: #a0a5b0;
      --warning: #ff6b6b;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --card: #1a1f26;
        --border: #2a2f36;
        --text: #e8eaed;
        --text-secondary: #b0b5c0;
        --muted: #6b7280;
      }
    }

    body {
      background: var(--bg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
    }

    .brand {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    header button {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.2, 0.6, 0.2, 1);
    }

    header button:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(255, 11, 88, 0.05);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 11, 88, 0.1);
    }

    header button:active {
      transform: translateY(0);
    }

    .container {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
      flex: 1;
    }

    #who {
      margin-bottom: 16px;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      animation: slideIn 0.3s ease-out;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      font-size: 16px;
      font-family: 'Inter', inherit;
      resize: vertical;
      background: var(--card);
      color: var(--text);
      transition: all 0.3s cubic-bezier(0.2, 0.6, 0.2, 1);
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 11, 88, 0.12), 0 8px 16px rgba(255, 11, 88, 0.08);
      transform: translateY(-2px);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 16px;
    }

    .info {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    #chars {
      font-weight: 600;
      color: var(--text);
      transition: color 0.2s ease;
    }

    #chars.warning {
      color: var(--warning);
      animation: pulse-warning 0.3s ease;
    }

    @keyframes pulse-warning {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    button#post {
      background: var(--accent);
      color: white;
      padding: 12px 28px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.3s cubic-bezier(0.2, 0.6, 0.2, 1);
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 11, 88, 0.2);
      position: relative;
      overflow: hidden;
    }

    button#post::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      transition: left 0.5s;
    }

    button#post:hover::before {
      left: 100%;
    }

    button#post:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(255, 11, 88, 0.3);
    }

    button#post:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 11, 88, 0.2);
    }

    button#post:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 9999;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">✍️ Share Your Thoughts</div>
    <div><button id="cancel">Cancel</button></div>
  </header>

  <div class="container">
    <div id="who" style="margin-bottom:8px;color:var(--text-secondary)"></div>
    <textarea id="content" maxlength="300" placeholder="What's on your mind?"></textarea>
    <div id="imagePreview" style="margin-top:16px;display:none;">
      <img id="previewImg" style="max-width:100%;border-radius:12px;max-height:300px;object-fit:cover;" alt="Image preview">
      <button type="button" id="removeImage" style="margin-top:10px;background:#ff6b6b;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;">Remove Image</button>
    </div>
    <div class="row">
      <div class="info">
        <label for="imageInput" style="cursor:pointer;color:var(--accent);font-weight:600;margin-right:16px;">📷 Add Image</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <span id="chars">0</span><span>/300</span>
      </div>
      <div>
        <button id="post">Post</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">✨ Thought shared</div>

  <script type="module">
    import { db, serverTimestamp } from './firebase.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const username = localStorage.getItem('username');
    if (!username) {
      window.location.href = 'name.html';
    }

    const who = document.getElementById('who');
    who.textContent = `Posting as: ${username}`;

    const contentEl = document.getElementById('content');
    const chars = document.getElementById('chars');
    const postBtn = document.getElementById('post');
    const cancelBtn = document.getElementById('cancel');
    const toast = document.getElementById('toast');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImageBtn = document.getElementById('removeImage');

    let selectedImageBase64 = null;

    // Image input handler - convert to Base64
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        // Check file size (max 2MB for practical Firestore limits)
        if (file.size > 2 * 1024 * 1024) {
          alert('Image too large. Max 2MB. Please choose a smaller image.');
          imageInput.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          selectedImageBase64 = event.target.result; // This is the base64 string
          previewImg.src = selectedImageBase64;
          imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    removeImageBtn.addEventListener('click', () => {
      selectedImageBase64 = null;
      imageInput.value = '';
      imagePreview.style.display = 'none';
    });

    contentEl.addEventListener('input', () => {
      const count = contentEl.value.length;
      chars.textContent = count;
      
      if (count > 225) {
        chars.classList.add('warning');
      } else {
        chars.classList.remove('warning');
      }
    });

    contentEl.focus();

    cancelBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    let cooldown = false;
    postBtn.addEventListener('click', async () => {
      if (cooldown) return;
      const text = contentEl.value.trim();
      if (text.length === 0 && !selectedImageBase64) {
        alert('Please write something or upload an image 😢');
        contentEl.focus();
        return;
      }
      if (text.length > 300) {
        alert('Text is too long. Max 300 characters.');
        return;
      }

      postBtn.disabled = true;
      postBtn.textContent = 'Posting...';

      try {
        // Save post with base64 image embedded in Firestore
        await addDoc(collection(db, 'posts'), {
          name: username,
          content: text,
          imageUrl: selectedImageBase64 || '', // Store base64 directly in Firestore
          reactions: {},
          timestamp: serverTimestamp()
        });

        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
          window.location.href = 'index.html';
        }, 1500);

        cooldown = true;
        setTimeout(() => { cooldown = false; }, 15000);
      } catch (err) {
        console.error(err);
        alert('Failed to post. Check console.');
        postBtn.disabled = false;
        postBtn.textContent = 'Post';
      }
    });

    contentEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        postBtn.click();
      }
    });
  </script>

  <script>
    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
